name: Generar APK Dulces Manualidades Ica

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del proyecto
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK de Prueba (Debug)
        run: gradle assembleDebug

      - name: Subir APK listo para instalar en el celular
        uses: actions/upload-artifact@v4
        with:
          name: DulcesManualidadesIca-APK
          path: app/build/outputs/apk/debug/app-debug.apk
